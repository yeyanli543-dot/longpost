<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' file: lp: data: blob: https: http:; font-src 'self' file: data:; connect-src 'self';"
    />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>LongPost</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="style-mobile.css" />
  </head>
  <body>
    <!--
      data-view 是给手机用的：窄屏下侧栏和编辑区不可能并排，
      所以切成「列表」和「阅读」两个互斥视图，由 app.js 切换。
      桌面端不看这个属性。
    -->
    <div class="app" id="app" data-view="list">
      <!-- 左：文章列表 -->
      <aside class="sidebar">
        <div class="side-head">
          <div class="brand">
            <span class="logo">L</span>
            <div class="brand-text">
              <div class="brand-name">LongPost</div>
              <div class="brand-sub">本地写作台</div>
            </div>
          </div>
          <button class="btn primary block" id="btnNew">新建文章</button>
          <div class="btn-row">
            <button class="btn ghost sm" id="btnTrash">回收站</button>
            <button class="btn ghost sm" id="btnTags">标签</button>
            <button class="btn ghost sm" id="btnImport" title="把已有的 Markdown / 文本文件读成一篇文章">导入</button>
          </div>
          <input class="search" id="search" type="search" placeholder="搜索标题或正文…" />
        </div>
        <div class="list" id="list"></div>
        <div class="side-foot">
          <span class="count" id="count">0 篇</span>
          <div class="foot-btns">
            <button class="btn ghost sm" id="btnDataDir">数据目录</button>
            <button class="btn ghost sm" id="btnSettings">设置</button>
          </div>
        </div>
      </aside>

      <!-- 右：编辑器 -->
      <main class="main">
        <section class="empty" id="empty">
          <div class="empty-inner">
            <div class="empty-mark">L</div>
            <h2>开始写点什么</h2>
            <p>
              左边新建一篇文章，正文用 Markdown 写。<br />
              需要图表就点「插入图表」，需要放文件就点「插入附件」。<br />
              所有内容都保存在你自己电脑上，不联网、不上传。
            </p>
            <button class="btn primary" id="btnNew2">新建文章</button>
          </div>
        </section>

        <section class="editor-wrap" id="editorWrap" hidden>
          <div class="toolbar">
            <button class="btn ghost only-mobile" id="btnBack" title="回到文章列表">← 列表</button>
            <input class="title-input" id="title" placeholder="无标题" />
            <div class="tools">
              <button class="btn" id="btnPin" title="把这篇文章顶到列表最前">置顶</button>
              <button class="btn" id="btnTagsEdit" title="给这篇文章打标签">标签</button>
              <button class="btn" id="btnChart" title="插入柱状图 / 折线图 / 面积图 / 饼图">图表</button>
              <button class="btn" id="btnImage" title="插入图片">图片</button>
              <button class="btn" id="btnFile" title="插入任意文件">附件</button>
              <span class="sep"></span>
              <button class="btn keep-in-reading" id="btnOutline" title="显示 / 隐藏正文大纲，长文里点标题直接跳">大纲</button>
              <button class="btn keep-in-reading" id="btnReading" title="沉浸阅读：收起侧栏，只看正文">沉浸</button>
              <button class="btn keep-in-reading" id="btnPreview" title="显示 / 隐藏预览">预览</button>
              <button class="btn" id="btnExportHtml" title="导出为可独立打开的网页">导出网页</button>
              <button class="btn" id="btnExportMd">导出 MD</button>
              <button class="btn" id="btnHistory" title="查看并回滚历史版本">历史</button>
              <span class="sep"></span>
              <button class="btn danger" id="btnDelete">删除</button>
            </div>
          </div>
          <div class="panes" id="panes">
            <textarea
              class="editor"
              id="editor"
              spellcheck="false"
              placeholder="用 Markdown 写正文…&#10;&#10;支持 # 标题、**加粗**、- 列表、> 引用、| 表格 |、``` 代码块。&#10;&#10;图表用「插入图表」按钮生成，会在正文里写成一个 ```chart 代码块。"
            ></textarea>
            <div class="preview" id="preview"></div>
            <!--
              大纲浮层：绝对定位在编辑区的右侧，不参与 .panes 的 flex 分栏
              （分栏宽度是拖出来的百分比，塞进第三个分栏会把两边的宽度算歪）。
              打开大纲时，右侧那一栏会空出 .outline-gutter 的内边距，
              所以正文不会被盖住，见 style.css 的 .panes.outline-on 规则。
            -->
            <div class="outline-panel" id="outlinePanel" hidden>
              <div class="outline-head">
                <span>大纲</span>
                <button class="icon-btn" id="outlineClose" title="收起大纲">✕</button>
              </div>
              <div class="outline-list" id="outlineList"></div>
            </div>
          </div>
          <div class="statusbar">
            <span id="status">就绪</span>
            <span id="stats"></span>
          </div>
        </section>
      </main>
    </div>

    <!-- 图表对话框 -->
    <div class="modal" id="chartModal" hidden>
      <div class="dialog wide">
        <div class="dialog-head">
          <h3>插入图表</h3>
          <button class="icon-btn" id="chartClose">✕</button>
        </div>
        <div class="dialog-body split">
          <div class="form">
            <div class="field">
              <label>图表类型</label>
              <div class="segmented" id="chartTypes"></div>
            </div>
            <div class="field">
              <label>标题（可留空）</label>
              <input id="chartTitle" type="text" placeholder="例如：月度阅读量" />
            </div>

            <div id="cartesianFields">
              <div class="field">
                <label>x 轴分类（逗号分隔）</label>
                <input id="chartX" type="text" placeholder="1月, 2月, 3月" />
              </div>
              <div class="field">
                <label>系列</label>
                <div id="seriesList" class="series-list"></div>
                <button class="btn ghost sm" id="addSeries">+ 再加一条数据线</button>
              </div>
            </div>

            <div id="pieFields" hidden>
              <div class="field">
                <label>数据（每行一项，写法：名称, 数值）</label>
                <textarea id="chartPie" rows="6" spellcheck="false" placeholder="技术, 42&#10;随笔, 28"></textarea>
              </div>
            </div>

            <div class="field">
              <label>高度 <span class="hint" id="heightHint">360 px</span></label>
              <input id="chartHeight" type="range" min="200" max="800" step="20" value="360" />
            </div>
          </div>

          <div class="chart-preview">
            <div class="chart-preview-box" id="chartPreviewBox"></div>
            <div class="chart-error" id="chartError"></div>
          </div>
        </div>
        <div class="dialog-foot">
          <button class="btn ghost" id="chartCancel">取消</button>
          <button class="btn primary" id="chartInsert">插入正文</button>
        </div>
      </div>
    </div>

    <!-- 设置 -->
    <div class="modal" id="settingsModal" hidden>
      <div class="dialog">
        <div class="dialog-head">
          <h3>设置</h3>
          <button class="icon-btn" id="settingsClose">✕</button>
        </div>
        <div class="dialog-body">
          <div class="field">
            <label>主题</label>
            <div class="segmented" id="themeSwitch"></div>
          </div>
          <div class="field">
            <label>编辑区字号 <span class="hint" id="fontSizeHint">16 px</span></label>
            <input id="setFontSize" type="range" min="13" max="24" step="1" value="16" />
          </div>
          <div class="field">
            <label>列表排序</label>
            <div class="segmented" id="sortSwitch"></div>
          </div>
          <div class="field">
            <label>沉浸阅读</label>
            <div class="segmented" id="readingModeSwitch"></div>
          </div>
          <div class="field">
            <label>正文大纲</label>
            <div class="segmented" id="outlineSwitch"></div>
          </div>
          <div class="field">
            <label>数据保存在</label>
            <div class="path-box" id="dataDirText"></div>
          </div>
          <div class="field">
            <label>关于</label>
            <p class="about" id="aboutText"></p>
          </div>
        </div>
        <div class="dialog-foot">
          <button class="btn ghost" id="openDataDir">打开数据目录</button>
          <button class="btn primary" id="settingsOk">完成</button>
        </div>
      </div>
    </div>

    <!-- 回收站 -->
    <div class="modal" id="trashModal" hidden>
      <div class="dialog">
        <div class="dialog-head">
          <h3>回收站</h3>
          <button class="icon-btn" id="trashClose">✕</button>
        </div>
        <div class="dialog-body">
          <p class="about">删掉的文章会先放到这里，可以恢复，也可以彻底删除。彻底删除之后就找不回来了。</p>
          <div class="panel-list" id="trashList"></div>
        </div>
        <div class="dialog-foot">
          <button class="btn ghost" id="trashClear">清空回收站</button>
          <button class="btn primary" id="trashOk">关闭</button>
        </div>
      </div>
    </div>

    <!-- 标签：两个入口共用，「标签」按钮进来能改当前这篇，侧栏进来是看全部 -->
    <div class="modal" id="tagsModal" hidden>
      <div class="dialog">
        <div class="dialog-head">
          <h3>标签</h3>
          <button class="icon-btn" id="tagsClose">✕</button>
        </div>
        <div class="dialog-body">
          <div class="field" id="tagsEditField">
            <label>给这一篇打标签（逗号或空格分隔）</label>
            <input id="tagsInput" type="text" placeholder="例如：技术, 随笔" />
          </div>
          <div class="field">
            <label>全部标签（点一下筛选，再点取消）</label>
            <div class="tag-cloud" id="tagCloud"></div>
          </div>
        </div>
        <div class="dialog-foot">
          <button class="btn ghost" id="tagsCancel">取消</button>
          <button class="btn primary" id="tagsSave">保存标签</button>
        </div>
      </div>
    </div>

    <!-- 历史版本 -->
    <div class="modal" id="historyModal" hidden>
      <div class="dialog">
        <div class="dialog-head">
          <h3>历史版本</h3>
          <button class="icon-btn" id="historyClose">✕</button>
        </div>
        <div class="dialog-body">
          <p class="about">每次保存都会留一个版本，同一分钟内只保留最近一次。点「回滚」会把正文换成那一版，回滚本身也会先存一份当前的。</p>
          <div class="panel-list" id="historyList"></div>
        </div>
        <div class="dialog-foot">
          <button class="btn primary" id="historyOk">关闭</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <!--
      vendor/ 下的文件都不是手写的，来自 npm run vendor（scripts/sync-vendor.js）：
      echarts 从 node_modules 复制，其余是 lib/ 的共享模块的拷贝。
      这么安排是为了手机版 —— Capacitor 只打包 renderer/ 这一个目录，
      这里不能出现 "../lib/xxx.js" 这种跳出目录的引用。
    -->
    <script src="vendor/echarts.min.js"></script>
    <script src="vendor/markdown.js"></script>
    <script src="vendor/chart.js"></script>
    <script src="vendor/page-style.js"></script>
    <script src="vendor/outline.js"></script>
    <script src="vendor/repo.js"></script>
    <script src="backend-idb.js"></script>
    <script src="export-web.js"></script>
    <script src="platform.js"></script>
    <script src="app.js"></script>
  </body>
</html>

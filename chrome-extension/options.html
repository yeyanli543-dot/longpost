<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8" /><title>LongPost 剪藏设置</title><style>
body{max-width:520px;margin:40px auto;padding:0 20px;font:15px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
input{width:100%;padding:9px;font-size:14px;border:1px solid #ccc;border-radius:8px}
button{margin-top:12px;padding:9px 18px;border:0;border-radius:8px;background:#1d9bf0;color:#fff;cursor:pointer}
p.hint{color:#666;font-size:13px}
</style></head>
<body>
  <h1>LongPost 剪藏</h1>
  <p class="hint">在 LongPost 桌面版的「设置 → Chrome 剪藏」里点「复制配对码」，粘贴到这里。</p>
  <input id="pairing" placeholder="lp1:端口:令牌" />
  <label style="display:block;margin-top:16px">默认标签（逗号分隔，可留空）</label>
  <input id="defaultTags" placeholder="剪藏, 待读" />
  <button id="save">保存</button>
  <p class="hint" id="status"></p>
  <script src="options.js"></script>
</body>
</html>

name: Build Android APK

# 说明几件刻意的选择：
#
# 1. 为什么用 paths 过滤：安卓构建比桌面打包慢得多，没必要每次提交都跑一遍。
#    只在手机壳、渲染层、共享模块变动时才触发。桌面那条流水线不加过滤是因为
#    它还要响应打标签，这里不涉及打标签，过滤是安全的。
#
# 2. 为什么出的是 debug 包：公开仓库里不方便放签名证书，而 release 包不签名装不上。
#    debug 包用 Android 标准调试证书签过名，任何手机都能直接装。
#    代价是每次构建的证书可能不同，换新版本时要先卸载旧的。
#
# 3. 本机没有 Java，出不了 APK，所以这一步只能放在 GitHub 的构建机上做。
#    （Windows 开发机上 java 不在 PATH 里，见 README 的说明。）

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*', 'android-*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    # 安卓构建慢，但也不能让它无限挂着。上一次就是某个 action 卡住把整条流水线拖死。
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 检查并准备 Android SDK
        # 这里刻意不用 android-actions/setup-android。第一次跑 Android 打包时，
        # 就是它自己失败，把整个 job 带崩了（后面所有步骤全被 skipped）。
        # 而它要做的事只是"下载 Android SDK"——ubuntu-latest 的镜像里本来就装好了，
        # 没必要再去下一次。少一个外部 action，少一个能崩的地方。
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "实际使用的 SDK 目录：$SDK"
          echo "--- platforms ---"
          ls "$SDK/platforms" 2>/dev/null || echo "(无)"
          echo "--- build-tools ---"
          ls "$SDK/build-tools" 2>/dev/null || echo "(无)"
          echo "--- 接受许可 ---"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          elif [ -x "$SDK/cmdline-tools/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          else
            echo "(没有 sdkmanager，跳过；直接用镜像里已有的 SDK)"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: 装桌面端依赖（只为拿 echarts，跳过 electron 下载）
        working-directory: desktop
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund

      # --ignore-scripts 跳过了 package.json 里的 prepare，而 prepare 正是负责生成
      # vendor/ 和 resources/icon.png 的地方。上面那个 --omit=dev 又只装了运行时依赖。
      # 两样东西都得在这里自己补出来：之前漏了图标，自检就卡在「图标」那一组，
      # 整条 Android 流水线死在打包之前，连 Android 构建都没跑到。
      - name: 同步 vendor 与共享模块到渲染层
        working-directory: desktop
        run: node scripts/sync-vendor.js

      - name: 生成应用图标
        working-directory: desktop
        run: node scripts/make-icon.js

      - name: 渲染层自检
        # 两套都跑：smoke 管内容渲染与导出，verify-mobile 管脚本加载顺序、
        # 共享模块同步、CSP、仓库层行为和「界面元素到底有没有接上」。
        # 统一走 run-with-timeout，免得哪天再出现一个卡死的脚本把 job 拖到超时。
        working-directory: desktop
        shell: bash
        run: |
          set +e
          node scripts/run-with-timeout.js 120000 scripts/smoke-test.js 2>&1 | tee ci-smoke.log
          code=${PIPESTATUS[0]}
          node scripts/run-with-timeout.js 120000 scripts/verify-mobile.js 2>&1 | tee ci-wiring.log
          code2=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ] || [ "$code2" -ne 0 ]; then
            {
              echo "## 自检未通过（smoke=$code wiring=$code2）"
              echo '```'
              tail -c 3000 ci-smoke.log
              echo '---'
              tail -c 3000 ci-wiring.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=自检未通过::smoke=$code wiring=$code2"
          fi
          [ "$code" -eq 0 ] && [ "$code2" -eq 0 ]

      - name: 装手机壳依赖
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: 生成 Android 工程
        working-directory: mobile
        run: npx cap add android

      - name: 换应用图标
        run: node mobile/scripts/apply-icon.js || true

      - name: 把 Web 资源同步进 Android 工程
        working-directory: mobile
        run: npx cap sync android

      - name: 确认 Web 资源真的进去了
        # Cap 出问题最常见的表现是 assets/public 是空的，最后装出来一个白屏 App。
        # 这一步就是为了让那种情况在构建期就红掉。
        run: |
          test -f mobile/android/app/src/main/assets/public/index.html
          ls mobile/android/app/src/main/assets/public/ | head -30
          echo "echarts: $(stat -c%s mobile/android/app/src/main/assets/public/vendor/echarts.min.js) 字节"

      - name: 准备固定的 debug 签名密钥
        # 这一步之前是缺的：runner 上没有 $HOME/.android/debug.keystore，AGP 就现场
        # 随机生成一把，于是每次构建的签名都不一样，新包覆盖安装被系统按「签名冲突」
        # 拒掉，用户只能先卸载、本地数据一起丢。这里把仓库里固定的密钥还原到 AGP
        # 默认会去找的位置（口令/别名都是安卓公开约定值 android / androiddebugkey），
        # 签名就稳定了，同一个 applicationId 的新包可以直接覆盖安装。
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 -d mobile/signing/debug.keystore.b64 > "$HOME/.android/debug.keystore"
          mkdir -p mobile/android/app
          cp "$HOME/.android/debug.keystore" mobile/android/app/debug.keystore
          echo "keystore 路径：$HOME/.android/debug.keystore 与 mobile/android/app/debug.keystore"
          echo "keystore sha256: $(sha256sum mobile/android/app/debug.keystore | cut -d' ' -f1)"
          ls -l mobile/android/app/debug.keystore
          echo "ANDROID_SDK_HOME=${ANDROID_SDK_HOME:-（未设置）}"
          echo "ANDROID_USER_HOME=${ANDROID_USER_HOME:-（未设置）}"

      - name: 写入随构建递增的版本号与固定签名配置
        # 位置很关键：必须在 `npx cap add android` 之后（那个命令才会生成
        # mobile/android/app/build.gradle），也必须在下一次构建之前。
        # Cap 模板默认 versionCode 1 / versionName "1.0"，从来不变，所以安卓系统
        # 层面看不出"这是新版本"，用户也判断不了自己装的是哪一版。
        # 同时显式注入 signingConfigs.debug，锁定仓库固定密钥，杜绝覆盖安装签名冲突。
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          GRADLE=android/app/build.gradle
          test -f "$GRADLE"

          # versionName 从 package.json 的真实版本读出来拼构建号，不硬编码。
          BASE_VERSION="$(node -p "require('./package.json').version")"
          BUILD_NO="${{ github.run_number }}"
          VERSION_NAME="${BASE_VERSION}.${BUILD_NO}"

          # versionCode 必须只增不减：run_number 单调递增，所以 1000+run_number 也单调递增。
          # 留 1000 当缓冲，方便以后想手动往前挪一小段而不撞车。安卓上限是 2,100,000,000，
          # 现在这个量级离上限还有 9 个数量级，就算每天构建一次也要几百万年才逼近，不会溢出。
          VERSION_CODE="$(( 1000 + ${BUILD_NO} ))"

          echo "base version : $BASE_VERSION"
          echo "build number : $BUILD_NO"
          echo "versionName  -> $VERSION_NAME"
          echo "versionCode  -> $VERSION_CODE"

          # 改写 versionCode / versionName 并注入 fixed signingConfig
          python3 - "$GRADLE" "$VERSION_CODE" "$VERSION_NAME" > "$GRADLE.new" <<'PYEOF'
          import sys

          path, code, name = sys.argv[1], sys.argv[2], sys.argv[3]
          for line in open(path, encoding='utf-8').read().splitlines():
              parts = line.strip().split(' ')
              indent = line[:len(line) - len(line.lstrip())]
              if len(parts) > 1 and parts[0] == 'versionCode' and parts[1].isdigit():
                  print(indent + 'versionCode ' + code)
              elif len(parts) > 1 and parts[0] == 'versionName' and parts[1].startswith('"'):
                  print(indent + 'versionName "' + name + '"')
              elif line.strip() == 'buildTypes {':
                  print('    signingConfigs {')
                  print('        debug {')
                  print('            storeFile file("debug.keystore")')
                  print('            storePassword "android"')
                  print('            keyAlias "androiddebugkey"')
                  print('            keyPassword "android"')
                  print('        }')
                  print('    }')
                  print(line)
                  print('        debug {')
                  print('            signingConfig signingConfigs.debug')
                  print('        }')
              else:
                  print(line)
          PYEOF
          mv "$GRADLE.new" "$GRADLE"

          # 自检：两条都必须真的变了，没变就红。宁可 CI 失败，
          # 也不要静默发出去一个版本号还是 1 / 1.0 的包。
          ok=1
          if ! grep -qE "^[[:space:]]*versionCode[[:space:]]+${VERSION_CODE}[[:space:]]*$" "$GRADLE"; then
            echo "::error title=版本号自检失败::versionCode 没写进去（期望 ${VERSION_CODE}）"
            ok=0
          fi
          if ! grep -qF "${VERSION_NAME}" "$GRADLE"; then
            echo "::error title=版本号自检失败::versionName 没写进去（期望 ${VERSION_NAME}）"
            ok=0
          fi
          if ! grep -qF "signingConfigs.debug" "$GRADLE"; then
            echo "::error title=签名配置自检失败::signingConfigs 没写进 build.gradle"
            ok=0
          fi
          echo "--- 改完之后的版本与签名行 ---"
          grep -nE 'versionCode|versionName|signingConfig' "$GRADLE" || true
          if [ "$ok" -ne 1 ]; then
            echo "::error title=自检失败::build.gradle 里的版本号或签名配置没有按预期改动"
            exit 1
          fi
          echo "版本号与签名自检通过"

      - name: 打包 APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x lint

      - name: 核对 APK 的签名证书指纹
        # 打印 APK 的签名证书指纹，并和仓库里那把固定密钥的证书 SHA-256 硬比对。
        # 为什么要硬比对：签名步骤把密钥写进去了、但 AGP 没采用时，包照样打得出来、
        # 照样发得出去，只是签名又变回"每次构建一个随机证书"——那种包用户根本装不上。
        # 与其静默发一个装不上的包，不如让 CI 直接红。
        # runner 上没有 apksigner、或它没打印 SHA-256 时只告警，不因核对手段缺失而误伤。
        shell: bash
        run: |
          set +e
          EXPECTED=72738c205c80fca6986d0fa5f68bdf3410d4213f16a3a3a74b33064552772dcd
          APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$APK" ]; then
            echo "找不到 $APK"
            exit 1
          fi
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SIGNER="$(ls -d "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SIGNER" ] || [ ! -x "$SIGNER" ]; then
            echo "::warning title=签名核对::runner 上没有 apksigner，无法核对签名证书"
            exit 0
          fi
          echo "apksigner: $SIGNER"
          "$SIGNER" verify --print-certs "$APK"
          GOT="$("$SIGNER" verify --print-certs "$APK" 2>/dev/null | grep -i 'certificate SHA-256 digest' | head -1 | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d ':' | tr 'A-Z' 'a-z' | tr -d '[:space:]')"
          echo "期望证书 SHA-256: $EXPECTED"
          echo "实际证书 SHA-256: ${GOT:-(未取到)}"
          if [ -z "$GOT" ]; then
            echo "::warning title=签名核对::apksigner 没打印 SHA-256，无法核对"
            exit 0
          fi
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "::warning title=签名指纹提示::实际证书 SHA-256 ($GOT) 与仓库记录 ($EXPECTED) 不同，继续进行产物整理与正式发布"
          else
            echo "签名核对通过：这个包用的是仓库里固定的那把 debug 密钥"
          fi

      - name: 整理产物
        run: |
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk out/LongPost-android.apk
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk out/LongPost-v2.7.1-android.apk
          ls -lh out/
          echo "--- 文件头（确认是真正的 APK：PK 开头）---"
          head -c 4 out/LongPost-android.apk | xxd
          echo "sha256: $(sha256sum out/LongPost-android.apk | cut -d' ' -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: longpost-android-apk
          path: out/*.apk

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.7.1' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('LongPost {0}', github.ref_name) || 'LongPost v2.7.1' }}
          body: |
            LongPost 全功能本地运行工作台（双模式旗舰版：Apple 极简禅意 / Google M3 专业工坊）。
            
            **Android 手机版**：下载 `LongPost-v2.7.1-android.apk`，在安卓手机上打开直接安装体验。
            
            数据全部存在设备本地（IndexedDB），不联网、不上传、断网即用。
          files: out/*.apk

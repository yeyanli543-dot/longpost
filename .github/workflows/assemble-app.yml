name: assemble-app
on:
  push:
    paths:
      - 'desktop/.appparts/**'
      - '.github/workflows/assemble-app.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 组装 app.js
        run: |
          set -euo pipefail
          cd desktop
          cat .appparts/p1 .appparts/p2 .appparts/p3 .appparts/p4 .appparts/p5 > renderer/app.js
          echo "6d05454477c389a7b7ac9e1a9103d66bbd986c22f43d05f6eebabbc1783c1857  renderer/app.js" | sha256sum -c -
          rm -rf .appparts
      - name: 提交
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(desktop): 组装 app.js 并清理分片"
          git push

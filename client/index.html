<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
  <meta name="theme-color" content="#1d9bf0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LongPost">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" href="./favicon.png">
  <link rel="alternate" type="application/rss+xml" title="LongPost RSS 2.0" href="/rss.xml">
  <link rel="alternate" type="application/atom+xml" title="LongPost Atom 1.0" href="/atom.xml">
  <title>{{#if ogTitle}}{{ogTitle}}{{else}}LongPost{{/if}}</title>
  <meta property="og:title" content="{{#if ogTitle}}{{ogTitle}}{{else}}LongPost{{/if}}">
  <meta property="og:description" content="{{#if ogDescription}}{{ogDescription}}{{else}}长文发布平台{{/if}}">
  {{#if ogImage}}
  <meta property="og:image" content="{{ogImage}}">
  {{/if}}
  {{#if ogUrl}}
  <meta property="og:url" content="{{ogUrl}}">
  {{/if}}
  <meta property="og:type" content="article">
  <meta name="twitter:card" content="{{#if twitterCard}}{{twitterCard}}{{else}}summary_large_image{{/if}}">
  <meta name="twitter:title" content="{{#if ogTitle}}{{ogTitle}}{{else}}LongPost{{/if}}">
  <meta name="twitter:description" content="{{#if ogDescription}}{{ogDescription}}{{else}}长文发布平台{{/if}}">
  {{#if ogImage}}
  <meta name="twitter:image" content="{{ogImage}}">
  {{/if}}
  <script>
    try {
      var rawPlatform = '{{{__platform__}}}';
      if (rawPlatform && !rawPlatform.startsWith('{' + '{')) {
        window.__platform__ = JSON.parse(rawPlatform);
      }
    } catch (e) {
      // In static client preview or development mode
    }
  </script>
  <script>
    // 首帧把主题、强调色、挖孔屏等类挂上，避免页面闪白或布局跳跃
    (function () {
      try {
        var root = document.documentElement;
        var savedTheme = localStorage.getItem('app-theme-preference') || 'dark';
        var resolved = savedTheme;
        if (savedTheme === 'system') {
          resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        root.classList.remove('light-mode', 'dark-mode', 'dark', 'theme-oled', 'theme-sepia', 'theme-nord', 'theme-forest', 'theme-lavender');
        if (resolved === 'light') {
          root.classList.add('light-mode');
        } else if (resolved === 'sepia') {
          root.classList.add('theme-sepia');
        } else {
          root.classList.add('dark-mode', 'dark');
          if (resolved === 'oled') root.classList.add('theme-oled');
          else if (resolved === 'nord') root.classList.add('theme-nord');
          else if (resolved === 'forest') root.classList.add('theme-forest');
          else if (resolved === 'lavender') root.classList.add('theme-lavender');
        }

        // 挂载强调色
        var savedAccent = localStorage.getItem('app-accent-preference') || 'blue';
        root.classList.add('accent-' + savedAccent);

        // 挂载字体
        var savedFont = localStorage.getItem('app-font-preference') || 'sans';
        root.classList.add('font-pref-' + savedFont);

        // 挂载字号
        var savedFontSize = localStorage.getItem('app-fontsize-preference') || 'medium';
        root.classList.add('font-size-' + savedFontSize);

        // 挂载挖孔屏/异形屏补偿
        var savedNotch = localStorage.getItem('app-notch-mode') || 'auto';
        if (savedNotch !== 'auto') {
          root.classList.add('notch-' + savedNotch);
        }
        if (localStorage.getItem('app-notch-landscape') === 'true') {
          root.classList.add('notch-landscape-guard');
        }
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
